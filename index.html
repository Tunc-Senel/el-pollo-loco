<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>El Pollo Locco</title>

        <!-- FAVICONS -->

        <!-- AUTOREN-STYLESHEET -->
        <link rel="stylesheet" type="text/css" href="./style.css">
       
    </head>

    <body>

        <h1>
            El Pollo Locco
        </h1>

        <div class="game-container">
            <canvas id="canvas" width="720" height="480"></canvas>

            <div id="settingsOverlay" class="settings-overlay">
                <section class="settings-window">
                    <header class="settings-header">
                        <h2>Settings</h2>

                        <button
                            id="closeSettingsButton"
                            class="settings-close-button"
                            aria-label="Close settings"
                        >
                            ×
                        </button>
                    </header>

                    <nav class="settings-tabs" aria-label="Settings tabs">
                        <button class="settings-tab active">
                            Sounds
                        </button>

                        <button class="settings-tab">
                            Key Assignment
                        </button>

                        <button class="settings-tab">
                            Story
                        </button>
                    </nav>

                    <div class="settings-content">
                        <section
                            id="sounds-settings"
                            class="settings-panel"
                        >
                            <div class="sound-setting-row">
                                <div>
                                    <h4>Sound Effects</h4>
                                    <p>Character, enemy and interaction sounds.</p>
                                </div>

                                <div class="toggle-selection">
                                    <button class="toggle-option active">ON</button>
                                    <button class="toggle-option">OFF</button>
                                </div>
                            </div>

                            <div class="sound-setting-row">
                                <div>
                                    <h4>Music</h4>
                                    <p>Background music during the game.</p>
                                </div>

                                <div class="toggle-selection">
                                    <button class="toggle-option active">ON</button>
                                    <button class="toggle-option">OFF</button>
                                </div>
                            </div>
                        </section>

                        <section
                            id="keys-settings"
                            class="settings-panel active"
                        >
                            <div class="key-assignment-table">
                                <div class="key-table-row key-table-header">
                                    <span>Action</span>
                                    <span>Key 1</span>
                                    <span>Key 2</span>
                                </div>

                                <div class="key-table-row">
                                    <span>Move Left</span>
                                    <kbd>Arrow Left</kbd>
                                    <kbd>A</kbd>
                                </div>

                                <div class="key-table-row">
                                    <span>Move Right</span>
                                    <kbd>Arrow Right</kbd>
                                    <kbd>D</kbd>
                                </div>

                                <div class="key-table-row">
                                    <span>Jump</span>
                                    <kbd>Arrow Up</kbd>
                                    <kbd>Space</kbd>
                                </div>

                                <div class="key-table-row">
                                    <span>Throw Bottle</span>
                                    <kbd>F</kbd>
                                    <kbd>—</kbd>
                                </div>

                                </div>
                            </div>
                        </section>

                </section>
            </div>

            <div id="gameControls" class="game-controls">
                <button class="control-button" id="soundButton">
                    <img id="sound-on-btn" src="assets/img/favicons/sound-on.png" alt="Sound On">
                    <img id="sound-off-btn" class="sound-off-btn d-none" src="assets/img/favicons/sound-of.png" alt="Sound Off">
                </button>

                <button class="control-button" id="settingsButton">
                    <img src="assets/img/favicons/settings.png" alt="Settings">
                </button>

                <button class="control-button" id="pauseButton">
                    <img id="pause-btn" src="assets/img/favicons/pause.png" alt="Pause">
                    <img id="play-btn" class="play-btn d-none" src="assets/img/favicons/play.png" alt="Play">
                </button>

                <button class="control-button" id="fullscreenButton">
                    <img src="assets/img/favicons/fullscreen.png" alt="Fullscreen">
                </button>
            </div>

            <div id="startScreen" class="start-screen">
                <button class="start-button">START GAME</button>
            </div>

            <div id="endScreenOverlay" class="start-screen d-none">
                <img id="endScreenImage" class="end-screen-image" src="" alt="End Screen">
                <button class="start-button" id="restartButton">RESTART GAME</button>
            </div>

            <div id="loadingScreen" class="loading-screen d-none">
                <h2 id="loadingText">Loading... 0%</h2>

                <div class="loading-card">
                    <div class="loading-chicken"></div>
                </div>
            </div>

        </div>
        
         <!-- AUTOREN-JAVASCRIPT -->
        <script src="./classes/drawable-object.class.js"></script>
        <script src="./classes/movable-object.class.js"></script>
        <script src="./classes/character.class.js"></script>
        <script src="./classes/chicken.class.js"></script>
        <script src="./classes/small-chicken.class.js"></script>
        <script src="./classes/coin.class.js"></script>
        <script src="./classes/bottle.class.js"></script>
        <script src="./classes/cloud.class.js"></script>
        <script src="./classes/status-bar.class.js"></script>
        <script src="./classes/health-bar.class.js"></script>
        <script src="./classes/coin-bar.class.js"></script>
        <script src="./classes/bottle-bar.class.js"></script>
        <script src="./classes/endboss-health-bar.class.js"></script>
        <script src="./classes/endboss.class.js"></script>
        <script src="./classes/game-state.class.js"></script>
        <script src="./classes/audio-manager.class.js"></script>
        <script src="./classes/endscreen.class.js"></script>
        <script src="./classes/world.class.js"></script>
        <script src="./classes/background-object.class.js"></script>
        <script src="./classes/keyboard.class.js"></script>
        <script src="./classes/level.class.js"></script>
        <script src="./classes/throwable-object.class.js"></script>
        <script src="./levels/level1.js"></script>
        <script src="./js/game.js" defer></script>

    </body>

</html>
